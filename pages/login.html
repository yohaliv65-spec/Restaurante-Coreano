<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Iniciar Sesión – Hanshikdang</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥢</text></svg>"/>
  <link rel="stylesheet" href="../css/base.css"/>
  <link rel="stylesheet" href="../css/auth.css"/>
</head>
<body class="auth-page">

<div class="auth-layout">
  <aside class="auth-deco">
    <a href="../index.html" class="deco-logo">
      <span class="logo-kr">한식당</span>
      <span class="logo-en">Hanshikdang</span>
    </a>
    <div class="deco-content">
      <div class="deco-kr">맛있게<br/>드세요!</div>
      <p class="deco-sub">Buen provecho · ¡Bienvenido!</p>
    </div>
    <div class="deco-circles">
      <div class="dc dc1"></div><div class="dc dc2"></div><div class="dc dc3"></div>
    </div>
    <div class="deco-dishes">
      <span class="dd" style="top:20%;left:10%">🥢</span>
      <span class="dd" style="top:40%;right:12%">🍲</span>
      <span class="dd" style="bottom:25%;left:15%">🍶</span>
      <span class="dd" style="top:65%;right:20%">🌶️</span>
    </div>
  </aside>

  <main class="auth-main">
    <a href="../index.html" class="back-link">← Volver al inicio</a>

    <!-- TABS -->
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Iniciar Sesión</button>
      <button class="auth-tab" data-tab="register">Crear Cuenta</button>
    </div>

    <div id="loginPanel" class="auth-panel">
      <div class="auth-head">
        <h1>Bienvenido de vuelta</h1>
        <p>Accede para reservar y gestionar tu cuenta</p>
      </div>
      <div id="loginError" class="form-error hidden"></div>
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" id="loginEmail" placeholder="tu@correo.com" autocomplete="email"/>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <div class="pass-wrap">
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password"/>
          <button type="button" class="eye-btn" id="eyeLogin">👁</button>
        </div>
      </div>
      <button class="btn-primary btn-w100" id="btnLogin">Iniciar Sesión</button>
      <div class="auth-divider"><span>o continúa con</span></div>
      <button class="btn-google" id="btnGoogle">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continuar con Google
      </button>
    </div>

    <div id="registerPanel" class="auth-panel hidden">
      <div class="auth-head">
        <h1>Crea tu cuenta</h1>
        <p>Únete y disfruta de reservaciones y beneficios exclusivos</p>
      </div>
      <div id="registerError" class="form-error hidden"></div>
      <div class="form-row">
        <div class="form-group">
          <label>Nombre</label>
          <input type="text" id="regName" placeholder="Tu nombre" autocomplete="given-name"/>
        </div>
        <div class="form-group">
          <label>Apellido</label>
          <input type="text" id="regLastname" placeholder="Tu apellido" autocomplete="family-name"/>
        </div>
      </div>
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" id="regEmail" placeholder="tu@correo.com" autocomplete="email"/>
      </div>
      
      <div class="form-group">
        <label>Teléfono / WhatsApp <span class="field-hint">(opcional - para notificaciones)</span></label>
        <div style="display: flex; gap: 8px; align-items: center;">
          <select id="regPhoneCode" style="width: 100px; padding: 12px 8px; border: 1.5px solid var(--ink-20); border-radius: 8px; background: var(--cream); font-size: 13px;">
            <option value="+52">🇲🇽 +52</option>
            <option value="+1">🇺🇸 +1</option>
            <option value="+57">🇨🇴 +57</option>
            <option value="+54">🇦🇷 +54</option>
            <option value="+34">🇪🇸 +34</option>
          </select>
          <input type="tel" id="regPhone" placeholder="55 1234 5678" autocomplete="tel" style="flex: 1; padding: 12px 14px; border: 1.5px solid var(--ink-20); border-radius: 8px; font-size: 14px; background: var(--cream);"/>
        </div>
      </div>
      
      <div class="form-group">
        <label>Contraseña</label>
        <div class="pass-wrap">
          <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" autocomplete="new-password"/>
          <button type="button" class="eye-btn" id="eyeReg">👁</button>
        </div>
        <div class="pass-strength" id="passStrength"></div>
      </div>
      <div class="form-group check-group">
        <label class="check-label">
          <input type="checkbox" id="acceptTerms"/>
          <span>Acepto los <a href="#" target="_blank">términos y condiciones</a></span>
        </label>
      </div>
      <button class="btn-primary btn-w100" id="btnRegister">Crear Cuenta</button>
      <div class="auth-divider"><span>o continúa con</span></div>
      <button class="btn-google" id="btnGoogleReg">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Registrarse con Google
      </button>
    </div>
  </main>
</div>

<div id="toastContainer"></div>

<script type="module" src="../js/auth.js"></script>
</body>
</html>
